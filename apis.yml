name: Orum
description: >-
  Orum is a payments infrastructure company that lets businesses move money and
  verify bank accounts through a single unified API. Its Deliver product provides
  "Direct to Fed" money movement across FedNow, RTP, Same Day ACH, ACH, Wires,
  and Visa Direct; Verify instantly confirms bank account status, ownership, and
  control; and Monitor is a portal for orchestrating and reconciling payment
  operations in real time. The REST API uses OAuth 2.0 client-credentials, offers
  signed webhooks for money-movement events, and ships a published OpenAPI spec
  and an OpenAPI-generated MCP server. Orum is backed by Accel, Bain Capital
  Ventures, and Craft Ventures.
