differences:
  - Sandbox requests do not trigger real money movement, KYC/KYB, or account verification.
  - Sandbox transfers complete instantly regardless of the speed parameter.
  - You must fund your sandbox account and track your own balance ledger.
  - Do not send real PII or financial information to sandbox.
